<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gemini Family Budget Command Center v10.3</title>
    <style>
        :root {
            --bg-color: #060911;
            --card-bg: rgba(18, 24, 38, 0.9);
            --inner-bg: rgba(28, 36, 56, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
            --border-hover: rgba(56, 189, 248, 0.5);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #34d399;
            --accent-yellow: #fbbf24;
            --accent-red: #f87171;
            --accent-purple: #c084fc;
        }

        * { box-sizing: border-box; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.08), transparent 40%),
                              radial-gradient(circle at 85% 85%, rgba(192, 132, 252, 0.08), transparent 40%);
            color: var(--text-primary);
            padding: 16px;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 20px;
            width: 100%;
            max-width: 1100px;
        }

        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
        }

        .dashboard-col {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
            background: var(--card-bg);
            padding: 8px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            overflow-x: auto;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--accent-blue), #0284c7);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .metric-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 18px;
        }

        .metric-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .metric-value {
            font-size: 1.6rem;
            font-weight: 700;
        }

        .metric-value.balance { color: var(--accent-green); }
        .metric-value.pace { color: var(--accent-blue); }

        .action-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 18px;
        }

        .action-card h3 {
            font-size: 0.95rem;
            margin-top: 0;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input, select {
            background: var(--inner-bg);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            color: var(--text-primary);
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            width: 100%;
        }

        input:focus, select:focus {
            border-color: var(--accent-blue);
        }

        .btn-action {
            background: linear-gradient(135deg, var(--accent-blue), #0284c7);
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
        }

        .btn-action:hover { opacity: 0.9; }

        .categories-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 18px;
        }

        .categories-section h2 {
            font-size: 1rem;
            margin-top: 0;
            margin-bottom: 6px;
        }

        .total-percent-warning {
            font-size: 0.8rem;
            color: var(--accent-yellow);
            margin-bottom: 14px;
        }

        .category-card {
            background: var(--inner-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .category-name { font-weight: 600; font-size: 0.95rem; }
        .category-percent { font-size: 0.85rem; font-weight: 600; color: var(--accent-blue); }

        .edit-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 6px;
            cursor: pointer;
        }

        .edit-btn:hover { background: var(--accent-blue); color: var(--bg-color); }

        .category-details {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .progress-bar-bg {
            background: rgba(0, 0, 0, 0.3);
            height: 6px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: 4px;
            width: 0%;
        }

        .chat-col {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            height: 600px;
        }

        .chat-header {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
            padding-right: 4px;
        }

        .chat-bubble {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            line-height: 1.4;
            max-width: 85%;
        }

        .chat-bubble.ai {
            background: var(--inner-bg);
            border: 1px solid var(--border-color);
            align-self: flex-start;
        }

        .chat-bubble.user {
            background: var(--accent-blue);
            color: var(--bg-color);
            font-weight: 500;
            align-self: flex-end;
        }

        .chat-input-area {
            display: flex;
            gap: 8px;
        }

        .chat-btn {
            background: var(--accent-purple);
            color: #ffffff;
            border: none;
            padding: 0 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(6, 9, 17, 0.8);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal {
            background: var(--card-bg);
            border: 1px solid var(--border-hover);
            padding: 24px;
            border-radius: 20px;
            width: 90%;
            max-width: 380px;
        }

        .modal h3 { margin-top: 0; margin-bottom: 14px; font-size: 1.1rem; }
        .modal label { display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 4px; }
        .modal input { margin-bottom: 12px; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 8px; }
        .btn { padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; border: none; }
        .btn-cancel { background: transparent; color: var(--text-secondary); border: 1px solid var(--border-color); }
        .btn-save { background: var(--accent-blue); color: var(--bg-color); font-weight: 600; }
    </style>
</head>
<body>

    <div class="main-layout">
        <div class="dashboard-col">
            <div class="nav-tabs">
                <button class="tab-btn active">Dash</button>
                <button class="tab-btn">Converter</button>
                <button class="tab-btn">Analytics</button>
                <button class="tab-btn">Wishlist</button>
                <button class="tab-btn">Income</button>
            </div>

            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-label">Total Balance</div>
                    <div class="metric-value balance" id="balance-display">14,500</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Daily Pace</div>
                    <div class="metric-value pace" id="pace-display">483</div>
                </div>
            </div>

            <div class="action-card">
                <h3>💰 Deposit Monthly Allowance</h3>
                <div class="input-group">
                    <input type="number" id="deposit-input" placeholder="Amount">
                    <button class="btn-action" id="deposit-btn">Deposit</button>
                </div>
            </div>

            <div class="action-card">
                <h3>💸 Quick Log Expense</h3>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <div class="input-group">
                        <input type="text" id="expense-desc" placeholder="Item description">
                        <input type="number" id="expense-amount" placeholder="Amount">
                    </div>
                    <div class="input-group">
                        <select id="expense-category"></select>
                        <button class="btn-action" id="deduct-btn">Deduct</button>
                    </div>
                </div>
            </div>

            <div class="categories-section">
                <h2>📁 Category Budgets (% of Balance)</h2>
                <div class="total-percent-warning" id="total-warning">Total Allocation: 100%</div>
                <div id="categories-container"></div>
            </div>
        </div>

        <div class="chat-col">
            <div class="chat-header">Ask anything about your account or budget!</div>
            <div class="chat-box" id="chat-box">
                <div class="chat-bubble ai">👋 Welcome! Your profile session is active and secure.</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Ask AI...">
                <button class="chat-btn" id="chat-send-btn">Ask</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <h3>Edit Category</h3>
            <label>Category Name</label>
            <input type="text" id="editName">
            <label>Target Share Percentage (%)</label>
            <input type="number" id="editPercent" step="1" min="0" max="100">
            <div class="modal-buttons">
                <button class="btn btn-cancel" id="modal-cancel-btn">Cancel</button>
                <button class="btn btn-save" id="modal-save-btn">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        let balance = 14500;
        let categories = [
            { id: '1', name: 'Savings', current: 0, percentShare: 25 },
            { id: '2', name: 'Emergency', current: 0, percentShare: 25 },
            { id: '3', name: 'Bills', current: 0, percentShare: 25 },
            { id: '4', name: 'Fun', current: 500, percentShare: 25 }
        ];

        let activeEditingId = null;

        function updateUI() {
            document.getElementById('balance-display').innerText = balance.toLocaleString();
            
            // Calculate total percentage to check balance
            let totalPct = categories.reduce((sum, cat) => sum + cat.percentShare, 0);
            const warningEl = document.getElementById('total-warning');
            warningEl.innerText = `Total Allocation: ${totalPct}%`;
            warningEl.style.color = totalPct === 100 ? 'var(--accent-green)' : 'var(--accent-yellow)';

            const container = document.getElementById('categories-container');
            container.innerHTML = '';

            categories.forEach(cat => {
                const targetMax = Math.round((balance * cat.percentShare) / 100);
                const progressRatio = targetMax > 0 ? Math.min(Math.round((cat.current / targetMax) * 100), 100) : 0;
                
                let barColor = 'var(--accent-blue)';
                if (progressRatio >= 100) barColor = 'var(--accent-red)';
                else if (progressRatio > 75) barColor = 'var(--accent-yellow)';

                const card = document.createElement('div');
                card.className = 'category-card';
                card.innerHTML = `
                    <div class="category-header">
                        <span class="category-name">${cat.name}</span>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span class="category-percent">${cat.percentShare}%</span>
                            <button class="edit-btn" data-id="${cat.id}">Edit</button>
                        </div>
                    </div>
                    <div class="category-details">
                        <span>Spent: ${cat.current.toLocaleString()} / Target Max: ${targetMax.toLocaleString()} KZT</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" style="width: ${progressRatio}%; background: ${barColor};"></div>
                    </div>
                `;
                container.appendChild(card);
            });

            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.onclick = function() {
                    openModal(this.getAttribute('data-id'));
                };
            });

            const select = document.getElementById('expense-category');
            select.innerHTML = '';
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat.name;
                opt.textContent = cat.name;
                select.appendChild(opt);
            });
        }

        function depositMoney() {
            const input = document.getElementById('deposit-input');
            const val = parseFloat(input.value);
            if (!isNaN(val) && val > 0) {
                balance += val;
                input.value = '';
                updateUI();
            }
        }

        function logExpense() {
            const amountInput = document.getElementById('expense-amount');
            const catSelect = document.getElementById('expense-category');
            const val = parseFloat(amountInput.value);

            if (!isNaN(val) && val > 0) {
                balance -= val;
                const cat = categories.find(c => c.name === catSelect.value);
                if (cat) {
                    cat.current += val;
                }
                amountInput.value = '';
                updateUI();
            }
        }

        function openModal(id) {
            activeEditingId = id;
            const cat = categories.find(c => c.id === id);
            if (cat) {
                document.getElementById('editName').value = cat.name;
                document.getElementById('editPercent').value = cat.percentShare;
                document.getElementById('editModal').style.display = 'flex';
            }
        }

        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
            activeEditingId = null;
        }

        function saveCategoryChanges() {
            const newName = document.getElementById('editName').value.trim();
            const newPercent = parseFloat(document.getElementById('editPercent').value);

            if (activeEditingId && newName && !isNaN(newPercent) && newPercent >= 0 && newPercent <= 100) {
                const targetCat = categories.find(c => c.id === activeEditingId);
                if (targetCat) {
                    const oldPercent = targetCat.percentShare;
                    const diff = newPercent - oldPercent; // e.g., -10% if dropping from 25 to 15

                    targetCat.name = newName;
                    targetCat.percentShare = newPercent;

                    // Smart auto-balance the remaining categories so total stays 100%
                    const otherCats = categories.filter(c => c.id !== activeEditingId);
                    if (otherCats.length > 0) {
                        // Distribute the difference proportionally or evenly across other categories
                        let adjustmentPerCat = diff / otherCats.length;
                        otherCats.forEach(c => {
                            c.percentShare = Math.round(Math.max(0, c.percentShare - adjustmentPerCat));
                        });

                        // Fine-tune rounding errors to ensure exact 100% match
                        let currentSum = categories.reduce((sum, c) => sum + c.percentShare, 0);
                        if (currentSum !== 100 && otherCats.length > 0) {
                            otherCats[0].percentShare += (100 - currentSum);
                        }
                    }
                }
                closeModal();
                updateUI();
            }
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            const chatBox = document.getElementById('chat-box');
            const userBubble = document.createElement('div');
            userBubble.className = 'chat-bubble user';
            userBubble.textContent = text;
            chatBox.appendChild(userBubble);
            
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            setTimeout(() => {
                const aiBubble = document.createElement('div');
                aiBubble.className = 'chat-bubble ai';
                aiBubble.textContent = `Smart auto-balancing is active! Your percentages will always balance out to 100%.`;
                chatBox.appendChild(aiBubble);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 500);
        }

        document.getElementById('deposit-btn').onclick = depositMoney;
        document.getElementById('deduct-btn').onclick = logExpense;
        document.getElementById('chat-send-btn').onclick = sendChatMessage;
        document.getElementById('modal-cancel-btn').onclick = closeModal;
        document.getElementById('modal-save-btn').onclick = saveCategoryChanges;

        document.getElementById('chat-input').onkeypress = function(e) {
            if (e.key === 'Enter') sendChatMessage();
        };

        updateUI();
    </script>
</body>
</html>
