<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gemini Family Budget Command Center v9.8</title>
    <style>
        :root {
            --bg-color: #060911;
            --card-bg: rgba(18, 24, 38, 0.9);
            --inner-bg: rgba(28, 36, 56, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
            --border-hover: rgba(56, 189, 248, 0.5);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #34d399;
            --accent-yellow: #fbbf24;
            --accent-red: #f87171;
            --accent-purple: #c084fc;
            --glow-shadow: 0 0 35px rgba(56, 189, 248, 0.15);
        }

        * { box-sizing: border-box; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.08), transparent 40%),
                              radial-gradient(circle at 85% 85%, rgba(192, 132, 252, 0.08), transparent 40%);
            color: var(--text-primary);
            padding: 24px;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        h2 {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .category-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .category-card:hover {
            border-color: var(--border-hover);
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .category-name {
            font-weight: 600;
            font-size: 1.05rem;
        }

        .category-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .category-percent {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent-blue);
        }

        .edit-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 5px 10px;
            font-size: 0.8rem;
            border-radius: 8px;
            cursor: pointer;
        }

        .edit-btn:hover {
            background: var(--accent-blue);
            color: var(--bg-color);
            border-color: var(--accent-blue);
        }

        .category-details {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .progress-bar-bg {
            background: var(--inner-bg);
            height: 8px;
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--accent-blue);
            border-radius: 6px;
            width: 0%;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(6, 9, 17, 0.8);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal {
            background: var(--card-bg);
            border: 1px solid var(--border-hover);
            padding: 24px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            box-shadow: var(--glow-shadow);
        }

        .modal h3 { margin-top: 0; margin-bottom: 16px; font-size: 1.2rem; }

        .modal label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .modal input {
            width: 100%;
            background: var(--inner-bg);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            color: var(--text-primary);
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 1rem;
        }

        .modal input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
        }

        .btn-cancel {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-save {
            background: var(--accent-blue);
            color: var(--bg-color);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>📁 Category Budgets</h2>
        <div id="categories-container">
            </div>
    </div>

    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <h3>Edit Category</h3>
            <label for="editName">Category Name</label>
            <input type="text" id="editName">
            
            <label for="editMax">Maximum Money (KZT)</label>
            <input type="number" id="editMax">
            
            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn btn-save" onclick="saveCategoryChanges()">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        // Initial Mock Data matching your requirements
        let categories = [
            { id: '1', name: 'Savings', current: 0, max: 3000 },
            { id: '2', name: 'Emergency', current: 0, max: 2000 },
            { id: '3', name: 'Bills', current: 0, max: 6000 },
            { id: '4', name: 'Fun', current: 500, max: 4000 }
        ];

        let activeEditingId = null;

        function renderCategories() {
            const container = document.getElementById('categories-container');
            container.innerHTML = '';

            categories.forEach(cat => {
                const max = cat.max > 0 ? cat.max : 1;
                const percent = Math.min(Math.round((cat.current / max) * 100), 100);
                
                // Dynamic progress bar coloring
                let barColor = 'var(--accent-blue)';
                if (percent >= 100) barColor = 'var(--accent-red)';
                else if (percent > 75) barColor = 'var(--accent-yellow)';

                const card = document.createElement('div');
                card.className = 'category-card';
                card.innerHTML = `
                    <div class="category-header">
                        <span class="category-name">${cat.name}</span>
                        <div class="category-actions">
                            <span class="category-percent">${percent}%</span>
                            <button class="edit-btn" onclick="openModal('${cat.id}')">Edit</button>
                        </div>
                    </div>
                    <div class="category-details">
                        <span>${cat.current.toLocaleString()} / ${cat.max.toLocaleString()} KZT</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" style="width: ${percent}%; background: ${barColor};"></div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openModal(id) {
            activeEditingId = id;
            const cat = categories.find(c => c.id === id);
            if (cat) {
                document.getElementById('editName').value = cat.name;
                document.getElementById('editMax').value = cat.max;
                document.getElementById('editModal').style.display = 'flex';
            }
        }

        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
            activeEditingId = null;
        }

        function saveCategoryChanges() {
            const newName = document.getElementById('editName').value.trim();
            const newMax = parseFloat(document.getElementById('editMax').value);

            if (activeEditingId && newName && !isNaN(newMax)) {
                const cat = categories.find(c => c.id === activeEditingId);
                if (cat) {
                    cat.name = newName;
                    cat.max = newMax;
                }
                closeModal();
                renderCategories();
            }
        }

        // Initial render on page load
        renderCategories();
    </script>
</body>
</html>
