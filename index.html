<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gemini Family Budget Command Center v9.7</title>
<style>
  :root {
    --bg-color: #060911;
    --card-bg: rgba(18, 24, 38, 0.9);
    --inner-bg: rgba(28, 36, 56, 0.6);
    --border-color: rgba(255, 255, 255, 0.1);
    --border-hover: rgba(56, 189, 248, 0.5);
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --accent-blue: #38bdf8;
    --accent-green: #34d399;
    --accent-yellow: #fbbf24;
    --accent-red: #f87171;
    --accent-purple: #c084fc;
    --glow-shadow: 0 0 35px rgba(56, 189, 248, 0.15);
  }

  * { box-sizing: border-box; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-color);
    background-image: 
      radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.08), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(192, 132, 252, 0.08), transparent 40%);
    color: var(--text-primary);
    padding: 16px 10px;
    margin: 0;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }

  body[dir="rtl"] { direction: rtl; text-align: right; }

  /* PROFILE & PIN OVERLAYS */
  .overlay-screen {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: var(--bg-color);
    backdrop-filter: blur(20px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }

  .box-card {
    background: var(--card-bg);
    border: 1px solid var(--border-hover);
    padding: 30px 24px;
    border-radius: 28px;
    text-align: center;
    box-shadow: var(--glow-shadow), 0 25px 50px rgba(0,0,0,0.7);
    max-width: 380px;
    width: 90%;
  }

  .profiles-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin: 20px 0;
  }

  .profile-tile {
    background: var(--inner-bg);
    border: 1px solid var(--border-color);
    padding: 14px 10px;
    border-radius: 16px;
    cursor: pointer;
    font-weight: 700;
    font-size: 13px;
    color: var(--text-primary);
  }

  .profile-tile:hover {
    border-color: var(--accent-blue);
    background: rgba(56, 189, 248, 0.1);
  }

  .pin-input {
    letter-spacing: 12px;
    font-size: 24px;
    text-align: center;
    width: 100%;
    margin: 15px 0;
    padding: 12px;
    border-radius: 16px;
    background: var(--bg-color);
    color: var(--text-primary);
    border: 1px solid var(--border-color);
  }

  /* DASHBOARD GRID */
  .dashboard-grid {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 16px;
    width: 100%;
    max-width: 1240px;
  }

  @media (max-width: 980px) {
    .dashboard-grid { grid-template-columns: 1fr; }
    body { padding: 8px 4px; }
  }

  .card {
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border-color);
    border-radius: 24px;
    padding: 20px 16px;
    box-shadow: var(--glow-shadow), 0 10px 30px rgba(0,0,0,0.5);
    width: 100%;
    overflow: hidden;
  }

  /* SCROLLABLE NAV TABS */
  .nav-tabs {
    display: flex;
    gap: 6px;
    background: var(--inner-bg);
    padding: 6px;
    border-radius: 16px;
    border: 1px solid var(--border-color);
    margin-bottom: 20px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  .nav-tabs::-webkit-scrollbar { display: none; }

  .nav-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    padding: 8px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
  }

  .nav-btn:hover { color: var(--text-primary); }

  .nav-btn.active {
    background: var(--accent-blue);
    color: #060911;
    box-shadow: 0 4px 14px rgba(56, 189, 248, 0.35);
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .badge {
    background: rgba(56, 189, 248, 0.1);
    color: var(--accent-blue);
    border: 1px solid rgba(56, 189, 248, 0.2);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 700;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 18px;
  }

  .stat-card {
    background: var(--inner-bg);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 14px;
  }

  .stat-title { font-size: 10px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
  .stat-value { font-size: 20px; font-weight: 800; margin-top: 4px; word-break: break-all; }

  .section-box {
    background: var(--inner-bg);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
  }

  input, select {
    background: var(--bg-color);
    color: var(--text-primary);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 13px;
    font-weight: 600;
    outline: none;
    width: 100%;
  }

  input:focus, select:focus {
    border-color: var(--accent-blue);
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
  }

  .btn-action {
    background: linear-gradient(135deg, #38bdf8, #0284c7
